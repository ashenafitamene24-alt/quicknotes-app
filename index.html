<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes — Fast & Elegant Note Taking</title>
  <meta name="description" content="QuickNotes is a lightweight, responsive note-taking web application with categories, search, instant validation, and local persistence.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Header: App Name and Tagline -->
  <header class="app-header">
    <div class="header-content">
      <div class="logo-group">
        <span class="logo-icon" aria-hidden="true">📝</span>
        <h1 class="app-title">QuickNotes</h1>
      </div>
      <p class="app-tagline">Capture your thoughts, organize your day, and find what matters instantly.</p>
    </div>
  </header>

  <!-- Main Content: Two Sections -->
  <main class="main-container">
    <!-- Section 1: Add a note -->
    <section class="section-card add-note-section" aria-labelledby="add-note-heading">
      <h2 id="add-note-heading" class="section-title">Add a note</h2>
      <form id="note-form" novalidate>
        <div class="form-group form-input-group">
          <label for="note-input" class="form-label">Note Content</label>
          <input 
            type="text" 
            id="note-input" 
            name="noteText" 
            placeholder="What's on your mind? (max 200 chars)" 
            autocomplete="off"
          >
        </div>

        <div class="form-group form-select-group">
          <label for="note-category" class="form-label">Category</label>
          <select id="note-category" name="noteCategory">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>

        <button type="submit" id="add-note-btn" class="btn btn-primary">Add Note</button>
      </form>
      <!-- Empty error paragraph for validation -->
      <p id="error-message" class="error-message" role="alert" aria-live="polite"></p>
    </section>

    <!-- Section 2: Your notes -->
    <section class="section-card your-notes-section" aria-labelledby="your-notes-heading">
      <div class="section-header-bar">
        <h2 id="your-notes-heading" class="section-title">Your notes</h2>
        <button type="button" id="clear-all-btn" class="btn btn-secondary clear-all-btn" title="Delete all notes">Clear All</button>
      </div>

      <div class="search-bar-wrapper">
        <label for="search-input" class="search-label sr-only">Search notes</label>
        <div class="search-input-group">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input 
            type="search" 
            id="search-input" 
            placeholder="Search notes by keyword..." 
            autocomplete="off"
          >
        </div>
      </div>

      <p id="note-count" class="note-count"></p>

      <ul id="notes-list" class="notes-list" aria-label="List of notes"></ul>
    </section>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <p>&copy; 2026 QuickNotes. Built with semantic HTML, CSS Flexbox &amp; Vanilla JavaScript.</p>
    </div>
  </footer>
</body>
</html>
